# Ative com SPRING_PROFILES_ACTIVE=postgres. O esquema vem só das migrações Flyway.
# URL completa, ou host/porta/nome separados (formato que provedores como o Render entregam).
spring.datasource.url=${SPUTNIK_DB_URL:jdbc:postgresql://${SPUTNIK_DB_HOST:localhost}:${SPUTNIK_DB_PORT:5432}/${SPUTNIK_DB_NAME:sputnik}}
spring.datasource.username=${SPUTNIK_DB_USER:sputnik}
spring.datasource.password=${SPUTNIK_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
