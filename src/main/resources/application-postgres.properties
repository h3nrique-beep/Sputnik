# Ative com SPRING_PROFILES_ACTIVE=postgres. O esquema vem só das migrações Flyway.
spring.datasource.url=${SPUTNIK_DB_URL:jdbc:postgresql://localhost:5432/sputnik}
spring.datasource.username=${SPUTNIK_DB_USER:sputnik}
spring.datasource.password=${SPUTNIK_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
