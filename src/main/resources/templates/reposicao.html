<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reposição | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head><body><div th:replace="~{fragments :: sidebar}"></div><main class="app"><header th:replace="~{fragments :: header('Relatório de Reposição','Itens abaixo do estoque mínimo')}"></header><section class="content"><div class="stats three"><article><small>Itens abaixo do mínimo</small><b th:text="${criticas.size()}">0</b></article><article><small>Sem estoque</small><b th:text="${zeradas}">0</b></article><article><small>Custo estimado</small><b th:text="${#numbers.formatCurrency(custo)}">R$ 0</b></article></div><div class="card"><table><thead><tr><th>Peça</th><th>Fornecedor</th><th>Disponível / mín.</th><th>Sugestão</th><th>Status</th></tr></thead><tbody><tr th:each="p:${criticas}"><td><b th:text="${p.nome}">Peça</b><small th:text="${p.codigo}">COD</small></td><td th:text="${p.fornecedor}">Fornecedor</td><td th:text="${p.estoqueDisponivel+' / '+p.estoqueMinimo}">0 / 5</td><td th:text="${sugestao.sugestao(p)+' un.'}">10 un.</td><td><span class="badge low" th:text="${p.estaZerada() ? 'Sem estoque' : 'Estoque baixo'}">Baixo</span></td></tr><tr th:if="${criticas.empty}"><td colspan="5">Todos os itens estão dentro do planejado.</td></tr></tbody></table></div><p class="right"><a class="button outline" href="/reposicao.csv">↓ Exportar relatório CSV</a></p></section></main></body></html>
