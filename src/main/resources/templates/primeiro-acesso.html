<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Altere sua senha | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head>
<body class="first-access-body"><main class="first-access-card"><div class="brand-lockup first-access-brand"><img src="/images/logo.jpg?v=2" alt="Logo Sputnik"><span><b>SPUTNIK</b><small>Primeiro acesso</small></span></div><div class="first-access-heading"><span class="step-chip">Etapa obrigatória</span><h1>Altere sua senha</h1><p>Defina uma senha pessoal para proteger sua conta e continuar para o sistema.</p></div><form th:action="@{/primeiro-acesso}" th:object="${form}" method="post"><label>Nova senha<input th:field="*{senha}" type="password" required minlength="8" autocomplete="new-password"><span class="field-hint">Use 8 caracteres ou mais, incluindo maiúscula, minúscula, número e caractere especial.</span></label><label>Confirme a nova senha<input th:field="*{confirmacaoSenha}" type="password" required autocomplete="new-password"></label><p class="error" th:if="${#fields.hasAnyErrors()}" th:text="${#fields.errors('*')}"></p><button class="primary first-access-submit" type="submit">Salvar e continuar</button></form></main></body>
</html>
