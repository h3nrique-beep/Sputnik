<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Peças | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head>
<body>
<div th:replace="~{fragments :: skip-link}"></div>
<div th:replace="~{fragments :: sidebar}"></div>
<main id="conteudo-principal" class="app"><header th:replace="~{fragments :: header('Peças', 'Consulte estoque contábil, disponível, preço e locação')}"></header>
<section class="content">
 <div th:replace="~{fragments :: flash}"></div>
 <div class="page-actions"><div><h2>Catálogo de peças</h2><p>Use os filtros para encontrar um item rapidamente.</p></div><a class="button" href="/pecas/nova">Nova peça</a></div>
 <form class="filters filters-search" method="get"><input class="search-input" name="busca" th:value="${busca}" placeholder="Buscar por nome, código ou fabricante" aria-label="Buscar peça"><select name="status" aria-label="Filtrar por status"><option value="">Todos os status</option><option value="baixo" th:selected="${status == 'baixo'}">Estoque baixo</option><option value="zerado" th:selected="${status == 'zerado'}">Sem estoque</option></select><button type="submit">Buscar</button></form>
 <div class="card table-card"><table><thead><tr><th>Código</th><th>Descrição</th><th>Categoria</th><th>Contábil</th><th>Disponível</th><th>Preço</th><th>Locação</th><th>Status</th></tr></thead><tbody><tr th:each="p : ${pecas}"><td class="mono" th:text="${p.codigo}">FO-102</td><td><b th:text="${p.nome}">Filtro</b><small th:text="${p.fabricante}">Tecfil</small></td><td th:text="${p.categoria}">Filtros</td><td th:text="${p.saldo}">5</td><td th:text="${p.estoqueDisponivel}">5</td><td th:text="${#numbers.formatCurrency(p.preco)}">R$ 0</td><td th:text="${p.localizacao}">Corredor C · Prateleira 2</td><td><span th:if="${p.estaZerada()}" class="badge zero">Sem estoque</span><span th:if="${!p.estaZerada() && p.estaAbaixoDoMinimo()}" class="badge low">Estoque baixo</span><span th:if="${!p.estaAbaixoDoMinimo()}" class="badge good">Em dia</span></td></tr><tr th:if="${pecas.empty}"><td colspan="8" class="empty-state">Nenhuma peça encontrada com estes filtros.</td></tr></tbody></table></div>
</section></main>
</body></html>
