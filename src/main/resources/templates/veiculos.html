<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veículos | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head>
<body>
<div th:replace="~{fragments :: skip-link}"></div><div th:replace="~{fragments :: sidebar}"></div>
<main id="conteudo-principal" class="app"><header th:replace="~{fragments :: header('Veículos','Consulte registros por placa ou chassi')}"></header>
<section class="content"><div th:replace="~{fragments :: flash}"></div>
 <div class="page-actions"><div><h2>Veículos cadastrados</h2><p>Cadastre dados técnicos e associe o cliente responsável quando necessário.</p></div><a class="button" href="/veiculos/novo">＋ Novo veículo</a></div>
 <form class="filters filters-search" method="get" action="/veiculos"><input class="search-input" type="search" name="busca" th:value="${busca}" placeholder="Buscar por placa ou chassi"><button type="submit">Buscar</button></form>
 <article class="card table-card"><table><thead><tr><th>Veículo</th><th>Placa</th><th>Chassi</th><th>Ano</th><th>KM atual</th><th>Cliente vinculado</th></tr></thead><tbody><tr th:each="veiculo : ${veiculos}"><td th:text="${veiculo.marcaModelo}">Modelo</td><td class="mono" th:text="${veiculo.placa}">ABC1D23</td><td th:text="${veiculo.chassi ?: 'Não informado'}">Chassi</td><td th:text="${veiculo.ano ?: '—'}">2025</td><td th:text="${veiculo.quilometragemAtual ?: '—'}">0</td><td th:text="${veiculo.cliente != null ? veiculo.cliente.nome : 'Não vinculado'}">Cliente</td></tr><tr th:if="${veiculos.empty}"><td colspan="6" class="empty-state">Nenhum veículo encontrado.</td></tr></tbody></table></article>
</section></main>
</body></html>
