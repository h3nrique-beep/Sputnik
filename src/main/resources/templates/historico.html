<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório Mensal | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head><body><div th:replace="~{fragments :: sidebar}"></div><main class="app"><header th:replace="~{fragments :: header('Relatório Mensal','Movimentações de estoque do período')}"></header><section class="content"><div th:replace="~{fragments :: flash}"></div><div class="card"><table><thead><tr><th>Data</th><th>Tipo</th><th>Peça</th><th>Quantidade</th><th>Contábil após</th><th>Disponível após</th><th>Operador</th><th>Observação</th></tr></thead><tbody><tr th:each="m:${movimentos}"><td th:text="${#temporals.format(m.data,'dd/MM/yyyy HH:mm')}">00/00</td><td th:text="${m.tipo}">SAÍDA</td><td th:text="${m.peca.nome}">Peça</td><td th:text="${m.quantidade}">1</td><td th:text="${m.saldoResultante}">0</td><td th:text="${m.saldoResultante}">0</td><td th:text="${m.operador}">Usuário</td><td th:text="${m.observacao ?: '—'}">—</td></tr><tr th:if="${movimentos.empty}"><td colspan="8">Nenhuma movimentação registrada neste período.</td></tr></tbody></table></div></section></main></body></html>
