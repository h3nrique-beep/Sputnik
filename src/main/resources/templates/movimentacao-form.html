<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Movimentar estoque | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head>
<body><div th:replace="~{fragments :: sidebar}"></div><main class="app"><header th:replace="~{fragments :: header('Movimentar estoque', 'Registre entradas e saídas com segurança')}"></header><section class="content narrow">
<div th:replace="~{fragments :: flash}"></div>
<form class="card form" th:action="@{/movimentacoes}" th:object="${form}" method="post"><div class="form-heading"><h2>Nova movimentação</h2><p>O saldo é atualizado após a confirmação.</p></div><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert"><p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}" class="mb-0">Revise os dados informados.</p></div><div class="grid"><label for="tipo">Tipo<select id="tipo" th:field="*{tipo}"><option value="">Selecione</option><option value="ENTRADA">Entrada</option><option value="SAIDA">Saída</option></select><small class="error" th:errors="*{tipo}"></small></label><label for="quantidade">Quantidade<input id="quantidade" type="number" min="1" th:field="*{quantidade}"><small class="error" th:errors="*{quantidade}"></small></label></div><label for="pecaId">Peça<select id="pecaId" th:field="*{pecaId}"><option value="">Selecione a peça</option><option th:each="p : ${pecas}" th:value="${p.id}" th:text="${p.nome + ' · ' + p.codigo + ' (saldo: ' + p.saldo + ')'}"></option></select><small class="error" th:errors="*{pecaId}"></small></label><label for="observacao">Observação <span class="optional">(opcional)</span><textarea id="observacao" th:field="*{observacao}" placeholder="Ex.: recebimento do fornecedor"></textarea></label><p class="note">Saídas acima do saldo disponível são bloqueadas automaticamente.</p><div class="form-actions"><a class="button outline" href="/pecas">Cancelar</a><button class="primary" type="submit">Confirmar movimentação</button></div></form>
</section></main></body></html>
