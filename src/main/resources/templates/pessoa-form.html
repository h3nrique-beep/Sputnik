<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastrar cliente | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head><body><div th:replace="~{fragments :: sidebar}"></div><main class="app"><header th:replace="~{fragments :: header('Cadastrar cliente','Registre os dados para vinculá-los aos veículos e ordens de serviço')}"></header><section class="content narrow"><form class="card form" th:action="@{/clientes}" th:object="${pessoa}" method="post"><div class="form-heading"><h2>Dados do cliente</h2><p>O cliente poderá ser selecionado ao cadastrar ou vincular um veículo.</p></div><label>Nome completo<input th:field="*{nome}" placeholder="Ex.: João Carlos"></label><label>Telefone<input th:field="*{telefone}" placeholder="(45) 99999-9999"></label><label>CPF<input th:field="*{cpf}" placeholder="000.000.000-00"></label><p class="error" th:if="${#fields.hasAnyErrors()}" th:text="${#fields.errors('*')}"></p><div class="form-actions"><a class="button outline" href="/clientes">Cancelar</a><button class="primary">Salvar cliente</button></div></form></section></main></body></html>
