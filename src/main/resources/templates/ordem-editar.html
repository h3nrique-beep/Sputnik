<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${'Editar OS #' + ordem.id + ' | Sputnik'}">Editar OS | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head>
<body><div th:replace="~{fragments :: sidebar}"></div><main class="app"><header th:replace="~{fragments :: header('Editar ordem de serviço','Atualize o status, a quilometragem e a descrição do atendimento')}"></header><section class="content narrow"><form class="card form" th:action="@{/ordens/{id}/editar(id=${ordem.id})}" th:object="${form}" method="post"><div class="form-heading"><h2 th:text="${'OS #' + ordem.id}">OS #1</h2><p th:text="${ordem.cliente.nome + ' · ' + ordem.veiculo.marcaModelo + ' · ' + ordem.veiculo.placa}">Cliente · veículo</p></div><div class="grid"><label>Status<select th:field="*{status}"><option th:each="status : ${statusDisponiveis}" th:value="${status}" th:text="${status.descricao}">Status</option></select></label><label>Quilometragem atual<input th:field="*{quilometragemAtual}" type="number" min="0"></label></div><label>Descrição do serviço<textarea th:field="*{descricao}"></textarea></label><p class="error" th:if="${#fields.hasAnyErrors()}" th:text="${#fields.errors('*')}"></p><div class="form-actions"><a class="button outline" th:href="@{/ordens/{id}(id=${ordem.id})}">Cancelar</a><button class="primary">Salvar alterações</button></div></form></section></main></body></html>
