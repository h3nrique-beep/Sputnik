<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permissões | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head>
<body><div th:replace="~{fragments :: sidebar}"></div><main class="app"><header th:replace="~{fragments :: header('Permissões do usuário','Defina exatamente quais módulos estarão disponíveis')}" ></header><section class="content narrow"><form class="card form" th:action="@{/admin/usuarios/{id}/permissoes(id=${usuarioEditado.id})}" th:object="${form}" method="post"><div class="form-heading"><h2 th:text="${usuarioEditado.nome}">Nome do usuário</h2><p th:text="${usuarioEditado.email}">email@empresa.com.br</p></div><fieldset class="permission-group"><legend>Abas permitidas</legend><label th:each="p:${permissoes}" class="permission-option"><input type="checkbox" th:field="*{permissoes}" th:value="${p}"><span th:text="${p.descricao}">Módulo</span></label></fieldset><div class="form-actions"><a class="button outline" href="/admin/usuarios">Cancelar</a><button class="primary" type="submit">Salvar permissões</button></div></form></section></main></body>
</html>
