<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastrar Peça | Sputnik</title><link rel="icon" type="image/jpeg" href="/images/logo.jpg?v=3"><link rel="stylesheet" href="/app.css"></head><body><div th:replace="~{fragments :: sidebar}"></div><main class="app"><header th:replace="~{fragments :: header('Cadastrar Peça','Inclua novas peças no catálogo')}"></header><section class="content narrow"><form class="card form" th:action="@{/pecas}" th:object="${peca}" method="post"><h2>Dados da peça</h2><label>Nome da peça<input th:field="*{nome}"></label><p class="error" th:errors="*{nome}"></p><div class="grid"><label>Código único<input th:field="*{codigo}"></label><label>Fabricante<input th:field="*{fabricante}"></label></div><p class="error" th:errors="*{codigo}"></p><div class="grid"><label>Categoria<select th:field="*{categoria}"><option value="Filtros">Filtros</option><option value="Freios">Freios</option><option value="Motor">Motor</option><option value="Ignição">Ignição</option><option value="Suspensão">Suspensão</option><option value="Elétrica">Elétrica</option><option value="Iluminação">Iluminação</option><option value="Transmissão">Transmissão</option><option value="Outros">Outros</option></select></label><label>Fornecedor<input th:field="*{fornecedor}"></label></div><div class="grid"><label>Preço (R$)<input type="number" step="0.01" th:field="*{preco}"></label><label>Locação<input th:field="*{localizacao}" placeholder="Corredor C · Prateleira 2"></label></div><div class="grid"><label>Estoque contábil inicial<input type="number" th:field="*{saldo}"></label><label>Estoque disponível inicial<input type="number" th:field="*{estoqueDisponivel}"></label></div><label>Estoque mínimo<input type="number" th:field="*{estoqueMinimo}"></label><p class="error" th:if="${#fields.hasAnyErrors()}" th:text="${#fields.errors('*')}"></p><button class="primary">Salvar peça</button></form></section></main></body></html>
