spring.application.name=Sputnik
spring.datasource.url=jdbc:h2:file:./data/sputnik;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
sputnik.bootstrap.admin.usuario=${SPUTNIK_BOOTSTRAP_ADMIN_USUARIO:admin}
# Obrigatória em banco vazio. Não há senha padrão no código.
sputnik.bootstrap.admin.senha=${SPUTNIK_BOOTSTRAP_ADMIN_PASSWORD:}
# Permanece desabilitado até a implantação com banco e observabilidade de produção.
sputnik.saas.self-signup.enabled=${SPUTNIK_SAAS_SELF_SIGNUP_ENABLED:false}
spring.jpa.hibernate.ddl-auto=update
# H2 local mantém o esquema automático; o perfil "postgres" usa Flyway (db/migration).
spring.flyway.enabled=false
spring.jpa.open-in-view=false
sputnik.backup.admin-empresa-id=${SPUTNIK_BACKUP_ADMIN_EMPRESA_ID:1}
# Console H2 desativado por padrão; habilite apenas localmente com SPUTNIK_H2_CONSOLE=true.
spring.h2.console.enabled=${SPUTNIK_H2_CONSOLE:false}
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
server.error.include-message=never
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Em produção, com HTTPS, defina SPUTNIK_COOKIE_SECURE=true.
server.servlet.session.cookie.secure=${SPUTNIK_COOKIE_SECURE:false}
