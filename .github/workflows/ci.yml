name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Inclui PostgresMigracaoIntegrationTest (PostgreSQL embutido) e o
      # OpenApiContratoTest, que falha se frontend/openapi.json estiver desatualizado.
      - run: mvn -B test

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Tipos da API batem com openapi.json
        run: |
          pnpm run api:types
          git diff --exit-code -- src/types/api.ts
      - run: pnpm run check
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm run build

  docker:
    name: Imagem Docker + compose
    runs-on: ubuntu-latest
    env:
      SPUTNIK_DB_PASSWORD: ci-senha-descartavel
      SPUTNIK_BOOTSTRAP_ADMIN_PASSWORD: Ci#Descartavel2026
    steps:
      - uses: actions/checkout@v4
      # --wait só retorna quando o healthcheck do app (GET /login) passa.
      - run: docker compose up -d --build --wait --wait-timeout 240
      - name: App responde e o admin inicial entra
        run: |
          curl -fsS -o /dev/null http://localhost:8080/login
          token=$(curl -fsS -c jar -b jar http://localhost:8080/api/security/csrf | jq -r .token)
          curl -fsS -c jar -b jar -H "X-CSRF-Token: $token" -H "Content-Type: application/json" \
            -d "{\"acesso\":\"admin\",\"senha\":\"$SPUTNIK_BOOTSTRAP_ADMIN_PASSWORD\"}" \
            http://localhost:8080/api/auth/login | jq -e '.perfil == "ADMIN"'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
